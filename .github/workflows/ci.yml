name: fit4012-lab3-ci

on:
  push:
  pull_request:

jobs:
  verify-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Tạm thời bỏ cache để đảm bảo cài đặt mới hoàn toàn
          # cache: 'pip' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Cài đặt pytest và các thư viện cần thiết
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Static syntax check
        run: |
          python -m py_compile sender.py receiver.py des_socket_utils.py

      - name: Submission contract check
        run: bash .github/scripts/check_submission.sh

      - name: Run tests

        run: python -m pytest -q


